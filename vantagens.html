<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Área restrita — API do Mercado Livre para afiliados</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <section id="gate">
    <h1>Área restrita</h1>
    <p class="lead">Conteúdo criptografado. Informe a senha para descriptografar.</p>
    <form id="gateForm">
      <label>Senha
        <input type="password" id="password" required autocomplete="current-password" autofocus>
      </label>
      <button type="submit" id="submit">Abrir</button>
    </form>
    <div id="error" class="box err" hidden></div>
  </section>

  <article id="content" hidden></article>

  <p id="backlink" hidden><a href="./">&larr; Voltar ao teste de OAuth</a></p>
</main>
<script src="vantagens.js"></script>
</body>
</html>
